<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<title>ডোনার তালিকা — কর্ণফুলী ব্লাড হাব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--r:#e11d2e;--ink:#1f1f23;--mut:#6b6b76;--bg:#fff5f6;--ln:#fde1e4;--ok:#15803d;--okb:#e8f7ee;--am:#a35f00;--amb:#fff3d6;--g:linear-gradient(135deg,#ff5a64,#e11d2e)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));line-height:1.5}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.w{max-width:480px;margin:0 auto;padding:0 16px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
header .w{display:flex;align-items:center;justify-content:space-between;height:60px}
header h1{font-size:19px}header h1 span{color:var(--r)}
.ib{width:42px;height:42px;border-radius:50%;background:#fff0f1;color:var(--r);display:flex;align-items:center;justify-content:center}

/* summary */
.sum{margin-top:16px;border-radius:26px;background:var(--g);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden;box-shadow:0 22px 40px -22px rgba(225,29,46,.7)}
.sum:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,255,255,.22);right:-70px;top:-90px}
.sum div{position:relative}.sum b{display:block;font-size:34px;line-height:1.1}.sum small{font-size:13px;opacity:.92}
.sum i{width:1px;align-self:stretch;background:rgba(255,255,255,.4)}

/* filters */
.fl{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);padding:12px 0 8px}
.sr{position:relative}
.sr svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--r)}
.sr input{width:100%;font:inherit;font-size:16px;padding:13px 14px 13px 44px;border:2px solid var(--ln);border-radius:16px;background:#fff;color:var(--ink)}
.sr input:focus{border-color:var(--r);outline:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:2px 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-width:52px;padding:8px 14px;border-radius:14px;background:#fff;border:2px solid var(--ln);color:var(--r);font-weight:700}
.chips button.on{background:var(--r);border-color:var(--r);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px;background:#fff;border:2px solid var(--ln);border-radius:16px;padding:4px}
.seg button{padding:8px 4px;border-radius:12px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--ink);color:#fff}
.meta{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 10px;font-size:14px;color:var(--mut)}
.meta b{color:var(--ink)}.meta button{color:var(--r);font-weight:700}

/* donor list */
.dn{background:#fff;border:1px solid var(--ln);border-radius:22px;margin-bottom:10px;overflow:hidden}
.dn.rest{background:#fffdfb}
.top{display:flex;gap:14px;padding:14px 14px 12px;align-items:center}
.gb{width:62px;height:62px;border-radius:18px;background:var(--g);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:700;line-height:1;flex:none;box-shadow:0 12px 20px -12px rgba(225,29,46,.8)}
.rest .gb{background:#c9c9d1;box-shadow:none}
.inf{flex:1;min-width:0}
.inf h3{font-size:17px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc{display:flex;gap:5px;align-items:center;font-size:13.5px;color:var(--mut);margin-top:2px}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.am{background:var(--amb);color:var(--am)}
.ft{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px dashed var(--ln);font-size:13px;color:var(--mut)}
.ft p{flex:1;min-width:0}.ft b{color:var(--ink)}
.ca{display:flex;gap:8px}
.ca a{height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
.cl{background:var(--ink);color:#fff;padding:0 16px}
.wa{width:42px;background:#e8f7ee;color:var(--ok)}
.btn{width:100%;padding:13px;border-radius:14px;background:var(--g);color:#fff;font-weight:700;margin-top:6px}
.btn.ghost{background:#fff;border:2px solid var(--ln);color:var(--r)}
.em{text-align:center;color:var(--mut);padding:36px 12px}.em svg{width:40px;height:40px;color:var(--r);margin-bottom:8px}.em p+p{font-size:14px;margin-top:2px}
.sk{height:132px;border-radius:22px;margin-bottom:10px;background:linear-gradient(90deg,#fde1e4,#fff,#fde1e4);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .w{display:flex;justify-content:space-around;align-items:center;height:68px}
nav a,nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mut);min-width:60px}nav .on{color:var(--r)}
nav .fab{width:58px;height:58px;border-radius:50%;background:var(--g);color:#fff;justify-content:center;margin-top:-26px;box-shadow:0 14px 26px -8px rgba(225,29,46,.7);border:4px solid #fff}
#dw{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#dw>div{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .35s}
.op #dw{opacity:1;pointer-events:auto}.op #dw>div{transform:none}
#dw a{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--ln);font-weight:600}#dw a svg{color:var(--r)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.300-4.300"/></symbol>
<symbol id="pin" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/></symbol>
<symbol id="phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.200 2 19.800 19.800 0 0 1-8.600-3.100 19.500 19.500 0 0 1-6-6A19.800 19.800 0 0 1 2.100 4.200 2 2 0 0 1 4.100 2h3a2 2 0 0 1 2 1.700c.1 1 .4 1.900.7 2.800a2 2 0 0 1-.5 2.100L8.100 9.900a16 16 0 0 0 6 6l1.300-1.300a2 2 0 0 1 2.100-.4c.9.3 1.800.6 2.800.7a2 2 0 0 1 1.700 2z"/></symbol>
<symbol id="msg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.800 7L4 20l1.200-4.500A8 8 0 1 1 21 12z"/></symbol>
<symbol id="drop" viewBox="0 0 24 24"><path d="M12 2.700S5 10 5 14.500a7 7 0 0 0 14 0C19 10 12 2.700 12 2.700z"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20a6.500 6.500 0 0 1 13 0"/><path d="M16 4.500a3.500 3.500 0 0 1 0 7M18 14.500a6.500 6.500 0 0 1 3.500 5.500"/></symbol>
<symbol id="clip" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.600 13.500 6.800 4M15.400 6.500l-6.800 4"/></symbol>
</defs></svg>

<header><div class="w">
  <div style="display:flex;align-items:center;gap:10px"><a class="ib" href="index.html" aria-label="পেছনে"><svg class="i"><use href="#back"/></svg></a><h1>ডোনার <span>তালিকা</span></h1></div>
  <button class="ib" id="mn" aria-label="মেনু"><svg class="i"><use href="#menu"/></svg></button>
</div></header>

<main class="w">
  <section class="sum" aria-live="polite">
    <div><b id="cT">–</b><small>নিবন্ধিত ডোনার</small></div><i></i>
    <div><b id="cR">–</b><small>এখন রক্ত দিতে প্রস্তুত</small></div>
  </section>

  <div class="fl">
    <label class="sr"><svg class="i"><use href="#search"/></svg><input id="q" type="search" placeholder="নাম, উপজেলা বা এলাকা খুঁজুন" autocomplete="off" aria-label="খুঁজুন"></label>
    <div class="chips" id="gc" role="group" aria-label="রক্তের গ্রুপ"></div>
    <div class="seg" id="st" role="group" aria-label="অবস্থা">
      <button class="on" data-v="">সবাই</button><button data-v="ready">প্রস্তুত</button><button data-v="rest">বিরতিতে</button>
    </div>
  </div>

  <div class="meta"><span id="rs">লোড হচ্ছে…</span><button id="rt" hidden>ফিল্টার মুছুন</button></div>
  <div id="ls"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  <button class="btn ghost" id="mo" hidden>আরও দেখুন</button>
</main>

<nav><div class="w">
  <a href="index.html"><svg class="i"><use href="#home"/></svg>হোম</a>
  <a class="on" href="all-donors.html"><svg class="i"><use href="#users"/></svg>ডোনার</a>
  <a class="fab" href="donor_registration.html" aria-label="ডোনার নিবন্ধন"><svg class="i" style="width:28px;height:28px"><use href="#plus"/></svg></a>
  <a href="blood_requests.html"><svg class="i"><use href="#clip"/></svg>রিকোয়েস্ট</a>
  <button id="mn2"><svg class="i"><use href="#menu"/></svg>মেনু</button>
</div></nav>

<div id="dw"><div>
  <a href="about.html"><svg class="i"><use href="#users"/></svg>আমাদের সম্পর্কে</a>
  <a href="donor_registration.html"><svg class="i"><use href="#drop"/></svg>ডোনার নিবন্ধন</a>
  <a href="blood_requests.html"><svg class="i"><use href="#clip"/></svg>রক্তের অনুরোধ</a>
  <a href="https://www.facebook.com/khb"><svg class="i"><use href="#share"/></svg>ফেসবুক পেজ</a>
  <button class="btn" id="dx">বন্ধ করুন</button>
</div></div>

<script>
const API="https://script.google.com/macros/s/AKfycbyGguWgJdIpVgv0Sol7qF7gJOelhv-y47NoW6my1ZnlSjxHcj7ygwlMuDxffRezTW4wbA/exec?sheet=Donors";
const BG=['A+','A-','B+','B-','AB+','AB-','O+','O-'],PAGE=15,$=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]),show=g=>g.replace('-','−');
const norm=g=>String(g||'').trim().toUpperCase().replace(/[−–]/g,'-');
const bnd=s=>String(s||'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
const ic=n=>`<svg class="i" style="width:15px;height:15px"><use href="#${n}"/></svg>`;

// menu
$('mn').onclick=$('mn2').onclick=()=>document.body.classList.add('op');
$('dw').onclick=e=>{if(e.target.id=='dw'||e.target.id=='dx')document.body.classList.remove('op')};

// availability: কখনো দেইনি / ৩ মাসের বেশি = ready; ৩ মাসের কম = registration date theke gona (purush 90 din, nari 120 din)
const isF=d=>d.some(x=>/^(female|মহিলা|নারী)$/i.test(String(x==null?'':x).trim()));
function avail(last,reg,fem){
  if(last==='কখনো দেইনি'||last==='৩ মাসের বেশি')return{s:'ready',t:'রক্ত দিতে প্রস্তুত',c:'ok'};
  const t=new Date(reg).getTime();
  if(last==='৩ মাসের কম'&&!isNaN(t)){
    const left=(fem?120:90)-Math.floor((Date.now()-t)/864e5);
    return left<=0?{s:'ready',t:'রক্ত দিতে প্রস্তুত',c:'ok'}:{s:'rest',t:`বিরতিতে · ${bn(left)} দিন বাকি`,c:'am'};
  }
  return{s:'rest',t:'বিরতিতে',c:'am'};
}

let all=[],view=[],shown=0,F={g:'',s:'',q:''};

function prep(rows){
  return (rows||[]).filter(r=>Array.isArray(r)&&r[0]).map((d,i)=>({
    name:String(d[0]).trim(),g:norm(d[1]),up:String(d[2]||'').trim(),area:String(d[3]||'').trim(),
    phone:String(d[4]||'').replace(/[^\d]/g,''),id:d[5],last:d[6],total:d[8],a:avail(d[6],d[9],isF(d)),i
  })).sort((x,y)=>(x.a.s=='ready'?0:1)-(y.a.s=='ready'?0:1)||y.i-x.i);
}

function card(d){
  const loc=[d.area,d.up].filter(Boolean).join(', ')||'ঠিকানা দেওয়া নেই';
  const wa=d.phone.replace(/^88/,'');
  const call=d.phone?`<div class="ca"><a class="cl" href="tel:${d.phone}" aria-label="${esc(d.name)} কে কল করুন">${ic('phone')}কল</a><a class="wa" href="https://wa.me/88${wa}" target="_blank" rel="noopener" aria-label="হোয়াটসঅ্যাপ">${ic('msg')}</a></div>`:'';
  const cnt=d.total?`${esc(d.total)} বার রক্ত দিয়েছেন`:'নতুন ডোনার';
  return `<article class="dn ${d.a.s}"><div class="top"><div class="gb" aria-label="রক্তের গ্রুপ ${esc(show(d.g))}">${esc(show(d.g))}</div>
  <div class="inf"><h3>${esc(d.name)}</h3><div class="loc">${ic('pin')}<span>${esc(loc)}</span></div><span class="pill ${d.a.c}">${d.a.t}</span></div></div>
  <div class="ft"><p><b>${cnt}</b>${d.last?`<br>শেষ রক্তদান: ${esc(d.last)}`:''}</p>${call}</div></article>`;
}

function apply(){
  const q=F.q.trim().toLowerCase();
  view=all.filter(d=>(!F.g||d.g===F.g)&&(!F.s||d.a.s===F.s)&&(!q||(d.name+' '+d.up+' '+d.area).toLowerCase().includes(q)));
  shown=0;$('ls').innerHTML='';more();
  const on=F.g||F.s||q;$('rt').hidden=!on;
  $('rs').innerHTML=all.length?`<b>${bn(view.length)} জন</b> ডোনার পাওয়া গেছে`:'';
}
function more(){
  const next=view.slice(shown,shown+PAGE);shown+=next.length;
  if(!view.length)$('ls').innerHTML=`<div class="em"><svg class="i"><use href="#search"/></svg><p><b>কোনো ডোনার পাওয়া যায়নি</b></p><p>অন্য গ্রুপ বা এলাকা দিয়ে চেষ্টা করুন, অথবা ফিল্টার মুছে দিন।</p></div>`;
  else $('ls').insertAdjacentHTML('beforeend',next.map(card).join(''));
  $('mo').hidden=shown>=view.length;
  $('mo').textContent=`আরও দেখুন (${bn(view.length-shown)} জন বাকি)`;
}

// controls
$('gc').innerHTML=`<button class="on" data-g="">সব</button>`+BG.map(g=>`<button data-g="${g}">${show(g)}</button>`).join('');
$('gc').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.g=b.dataset.g;[...$('gc').children].forEach(x=>x.classList.toggle('on',x==b));apply()};
$('st').onclick=e=>{const b=e.target.closest('button');if(!b)return;F.s=b.dataset.v;[...$('st').children].forEach(x=>x.classList.toggle('on',x==b));apply()};
let tm;$('q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{F.q=e.target.value;apply()},180)};
$('mo').onclick=more;
$('rt').onclick=()=>{F={g:'',s:'',q:''};$('q').value='';[...$('gc').children].forEach((x,i)=>x.classList.toggle('on',i==0));[...$('st').children].forEach((x,i)=>x.classList.toggle('on',i==0));apply()};

// load (ekbar-i fetch, filter client-side)
function load(){
  $('ls').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';$('rs').textContent='লোড হচ্ছে…';
  Promise.race([fetch(API).then(r=>r.json()),new Promise((_,j)=>setTimeout(j,15000))]).then(rows=>{
    all=prep(rows);$('cT').textContent=bn(all.length);$('cR').textContent=bn(all.filter(d=>d.a.s=='ready').length);apply();
  }).catch(()=>{
    $('rs').textContent='';$('mo').hidden=true;
    $('ls').innerHTML=`<div class="em"><p><b>ডাটা লোড করা যায়নি</b></p><p>ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।</p><button class="btn" id="rl" style="max-width:220px;margin-top:14px">আবার চেষ্টা করুন</button></div>`;
    $('rl').onclick=load;
  });
}
// URL params: all-donors.html?g=B%2B&q=পটিয়া&s=ready
(function(){const p=new URLSearchParams(location.search);
  let g=norm((p.get('g')||'').replace(/ $/,'+'));
  if(BG.includes(g)){F.g=g;[...$('gc').children].forEach(x=>x.classList.toggle('on',x.dataset.g===g))}
  const q=(p.get('q')||'').trim();if(q){F.q=q;$('q').value=q}
  const s=p.get('s');if(s==='ready'||s==='rest'){F.s=s;[...$('st').children].forEach(x=>x.classList.toggle('on',x.dataset.v===s))}
})();
load();
</script>
</body>
</html>
